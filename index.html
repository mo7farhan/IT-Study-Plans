<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>البوابة الأكاديمية - كلية العلوم وتكنولوجيا المعلومات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f5f5;--card:#fff;--ink:#2a1a1e;--mut:#6c5a5e;--acc:#d1304e;--soft:#fbe8ec;--rule:#e8dcde;--line:#d9a0ae}
@media (prefers-color-scheme:dark){:root{--bg:#171114;--card:#221a1d;--ink:#f4eaec;--mut:#b9a8ac;--acc:#e04a68;--soft:#3a2229;--rule:#3a2f33;--line:#a35a6e}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px 24px;font-family:'Cairo','Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden}
main{position:relative;z-index:1;width:100%;max-width:1100px;margin:auto;text-align:center}
.root{display:inline-block;margin:0;padding:16px 44px;border-radius:999px;background:var(--acc);color:#fff;font-size:clamp(22px,3.4vw,36px);font-weight:900;line-height:1.3;box-shadow:0 12px 28px rgba(209,48,78,.28)}
.sub{margin:16px 0 0;color:var(--mut);font-size:clamp(15px,1.8vw,18px);font-weight:700}
.stem{width:2px;height:30px;background:var(--line);margin:18px auto 0}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;position:relative;padding-top:30px}
.row::before{content:"";position:absolute;top:0;inset-inline:calc(12.5% - 7.5px);height:2px;background:var(--line)}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:38px 16px 30px;background:var(--card);border:2px solid var(--rule);border-radius:22px;color:var(--ink);text-decoration:none;box-shadow:0 10px 22px rgba(0,0,0,.04);transition:transform .25s,border-color .25s,box-shadow .25s}
.card::before{content:"";position:absolute;top:-32px;left:calc(50% - 1px);width:2px;height:30px;background:var(--line);transition:background .25s}
.card::after{content:"";position:absolute;top:-10px;left:calc(50% - 6px);border:6px solid transparent;border-top:9px solid var(--line);border-bottom:0;transition:border-color .25s}
.card:hover,.card:focus-visible{transform:translateY(-8px);border-color:var(--acc);box-shadow:0 18px 34px rgba(209,48,78,.16);outline:none}
.card:hover::before{background:var(--acc)}
.card:hover::after{border-top-color:var(--acc)}
.card:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.name{font-size:26px;font-weight:900;line-height:1.3}
.en{font-size:13px;color:var(--mut);direction:ltr;letter-spacing:.03em}
.go{margin-top:8px;font-size:14px;font-weight:700;color:var(--acc)}
footer{position:relative;z-index:1;margin-top:36px;color:var(--mut);opacity:.8;font-size:14px}
@media (max-width:900px){
 .row{grid-template-columns:repeat(2,1fr);padding-top:0;margin-top:26px}
 .row::before,.card::before,.card::after,.stem{display:none}
}
@media (max-width:520px){.row{grid-template-columns:1fr}.root{padding:14px 26px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
 <h1 class="root">كلية العلوم وتكنولوجيا المعلومات</h1>
 <p class="sub">اختر تخصصك الجامعي لعرض خطتك الشجرية التفاعلية</p>
 <div class="stem" aria-hidden="true"></div>
 <nav class="row">
  <a class="card" href="CS_Plan.html">
   <span class="name">علم الحاسوب</span><span class="en">Computer Science</span><span class="go">عرض الخطة ←</span>
  </a>
  <a class="card" href="SE_Plan.html">
   <span class="name">هندسة البرمجيات</span><span class="en">Software Engineering</span><span class="go">عرض الخطة ←</span>
  </a>
  <a class="card" href="AI_Plan.html">
   <span class="name">الذكاء الاصطناعي</span><span class="en">Artificial Intelligence</span><span class="go">عرض الخطة ←</span>
  </a>
  <a class="card" href="CYS_Plan.html">
   <span class="name">الأمن السيبراني</span><span class="en">Cyber Security</span><span class="go">عرض الخطة ←</span>
  </a>
 </nav>
</main>
<footer>تم التطوير بواسطة محمد فرحان</footer>
</body>
</html>
